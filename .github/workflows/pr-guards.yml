name: PR Guards

# Three independent checks that enforce process rules mechanically rather
# than relying on reviewer discipline.
#
# changelog-guard  - custom_components/ edits must be accompanied by a
#                    CHANGELOG.md update (exemptions: skip-changelog label,
#                    or any of the ci/tests/documentation/dependencies/
#                    github-actions labels).
#
# label-guard      - every PR must carry at least one label recognised by
#                    .github/release.yml so auto-generated release notes
#                    group it correctly.
#
# history-guard    - docs/HISTORY.md may only be modified on claude/bump-*
#                    branches (version-bump PRs); never on feature branches.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-guard:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md is updated alongside custom_components/ changes
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Labels that exempt this PR from the CHANGELOG requirement.
          EXEMPT="ci tests documentation dependencies github-actions skip-changelog"
          for exempt in $EXEMPT; do
            if echo "$PR_LABELS" | jq -r '.[]' | grep -qxF "$exempt"; then
              echo "Skipping changelog check (exempt label: $exempt)"
              exit 0
            fi
          done

          CHANGED_COMPONENTS=$(git diff --name-only "origin/${BASE_REF}..." \
            | grep "^custom_components/" || true)
          if [ -z "$CHANGED_COMPONENTS" ]; then
            echo "No custom_components/ changes detected; skipping changelog check."
            exit 0
          fi

          CHANGELOG_CHANGED=$(git diff --name-only "origin/${BASE_REF}..." \
            | grep "^CHANGELOG\.md$" || true)
          if [ -z "$CHANGELOG_CHANGED" ]; then
            echo "::error::CHANGELOG.md was not updated alongside custom_components/ changes." \
              "Add a bullet to the [Unreleased] section, or apply the 'skip-changelog' label" \
              "if this change does not need a user-visible entry."
            exit 1
          fi
          echo "CHANGELOG.md updated alongside custom_components/ changes."

  label-guard:
    name: PR has release-notes label
    runs-on: ubuntu-latest
    steps:
      - name: Check PR carries a release-notes label
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Labels recognised by .github/release.yml. Keep in sync with that file.
          VALID="security bug fix enhancement feat documentation tests ci github-actions dependencies"
          for valid in $VALID; do
            if echo "$PR_LABELS" | jq -r '.[]' | grep -qxF "$valid"; then
              echo "Found release-notes label: $valid"
              exit 0
            fi
          done
          echo "::error::This PR has no release-notes label." \
            "Add one of: security, bug/fix, enhancement/feat, documentation," \
            "tests, ci, github-actions, dependencies." \
            "PRs with a Conventional Commit prefix (feat:, fix:, docs:, ci:, etc.)" \
            "in their title are auto-labelled by pr-labeler.yml."
          exit 1

  history-guard:
    name: HISTORY.md only in bump PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Reject HISTORY.md edits outside claude/bump-* branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if echo "$HEAD_REF" | grep -qE '^claude/bump-'; then
            echo "Bump branch; HISTORY.md changes are allowed."
            exit 0
          fi
          HISTORY_CHANGED=$(git diff --name-only "origin/${BASE_REF}..." \
            | grep "^docs/HISTORY\.md$" || true)
          if [ -n "$HISTORY_CHANGED" ]; then
            echo "::error::docs/HISTORY.md was modified outside a claude/bump-* branch." \
              "HISTORY.md is updated only in version-bump PRs; see CLAUDE.md for guidance."
            exit 1
          fi
          echo "docs/HISTORY.md not modified; OK."
