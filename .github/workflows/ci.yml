name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: home-assistant/actions/hassfest@e91ad1948e57189485b9c1ad608af0c303946f89  # master tip 2026-06-14

  hacs-preflight:
    name: HACS manifest pre-flight (local rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: "3.14"
      - name: Run HACS manifest checks
        run: python scripts/validate_hacs.py
      - name: Run docs prose checks
        run: python scripts/validate_docs.py
      - name: Check agentrc.eval.json file references
        run: python scripts/check_agentrc_refs.py

  hacs:
    name: Validate with HACS Action
    runs-on: ubuntu-latest
    needs: hacs-preflight
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main tip 2026-06-14
        with:
          category: integration

  ruff:
    name: Ruff lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: "3.14"
          cache: pip
      - name: Install lint dependencies
        run: pip install -r requirements-lint.txt
      - name: Ruff lint & format check (custom_components/ + tests/)
        run: python scripts/run_lint.py
      - name: Check strings.json matches translations/en.json
        run: python scripts/check_translations.py

  typecheck:
    name: Mypy type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: "3.14"
          cache: pip
      # mypy needs the full Home Assistant stack installed so it type-checks
      # against real HA types rather than falling back to `Any` everywhere.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: python scripts/run_typecheck.py

  test:
    name: Run tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest HA: whatever requirements-dev.txt resolves (its pinned
          # pytest-homeassistant-custom-component drives the HA version).
          - name: latest HA
            ha_pin: ""
          # Minimum supported HA: the floor declared in hacs.json. The pinned
          # pytest-homeassistant-custom-component release must match this HA
          # version (0.13.317 maps to homeassistant 2026.3.1) - the first
          # PHACC/HA pairing that requires Python 3.14 (#228); HA supports
          # only a single Python minor at a time, so this is the earliest
          # release actually compatible with the ruff/mypy/CI 3.14 floor.
          # When the floor moves, bump both pins here alongside hacs.json
          # and the README.
          - name: minimum HA (2026.3.1)
            ha_pin: "homeassistant==2026.3.1 pytest-homeassistant-custom-component==0.13.317"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Pin minimum Home Assistant
        # Override the requirements-dev pins for the minimum-HA leg only, so the
        # declared floor is exercised by the suite rather than only the latest.
        if: matrix.ha_pin != ''
        run: pip install ${{ matrix.ha_pin }}
      - name: Run tests with coverage
        # --cov-fail-under lives here (and in `make test`), not in pytest
        # addopts, so targeted local runs of a single file still pass.
        run: pytest tests/ -v --cov-report=xml --cov-fail-under=95
      - name: Upload coverage to Codecov
        # Upload once (latest leg only) to avoid duplicate reports.
        if: ${{ always() && matrix.ha_pin == '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
