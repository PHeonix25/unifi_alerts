name: Agentrc Quality Score

# Phase 3 of the agentic-eval-harness plan (docs/research/agentic-eval-harness.md,
# #287): an advisory, non-blocking PR check. Runs scripts/run_agentrc_eval.py
# (phase 1's single-model harness) against agentrc.eval.json's cases and
# posts/updates one PR comment with the pass-rate table - never a required
# status check, never a merge gate.
#
# Path-scoped on purpose: only PRs touching agentrc.eval.json, CLAUDE.md,
# AGENTS.md, or the integration source are likely to change what this
# actually measures (plan quality against the current instructions/codebase).
# Running it on every PR regardless of diff would just re-run the same fixed
# cases for no signal, at real API cost - see the design note's cost-creep
# risk.
#
# No-op if ANTHROPIC_API_KEY isn't configured as a repo secret: both the run
# and comment steps are gated on its presence, so an unconfigured repo gets
# a trivially-successful, silent job - no red X, no comment spam - rather
# than a spurious failure on every matching PR. Set the secret to turn this
# on for real.
#
# This landed without having first "run phase 1/2 long enough to establish
# the harness's own false-positive rate", which the design note calls a
# precondition for phase 3. Justification for building it anyway: this
# workflow cannot block a merge or spend money silently (gated on the
# secret, advisory comment only), so the risk of shipping it unvalidated is
# low - but treat its output as unproven until it's been watched across a
# handful of real PRs.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "agentrc.eval.json"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "custom_components/unifi_alerts/**"

permissions:
  contents: read
  pull-requests: write

env:
  # Single source of truth for both the harness invocation and the PR
  # comment text below, so the two can't drift apart.
  AGENTRC_MODEL: claude-haiku-4-5-20251001

jobs:
  quality-score:
    name: Post advisory plan-quality score
    runs-on: ubuntu-latest
    # secrets.* cannot be used directly in `if:` conditions (a GitHub Actions
    # limitation, not a typo - see actions/runner#520), so mirror it into a
    # job-level env var and gate on that instead.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          python-version: "3.14"

      - name: Run harness
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_agentrc_eval.py --model "$AGENTRC_MODEL"

      - name: Post or update PR comment
        if: env.HAS_ANTHROPIC_KEY == 'true'
        continue-on-error: true # advisory only - a comment-post failure (e.g. a fork PR's read-only token) must never fail this job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER="<!-- agentrc-quality-score -->"
          BODY_FILE=$(mktemp)
          {
            echo "$MARKER"
            echo ""
            echo "### agentrc.eval.json quality score (advisory, non-blocking)"
            echo ""
            cat .agentrc-eval-out/summary.md
            echo ""
            echo "Model: \`$AGENTRC_MODEL\`. Full plans and per-item verdicts are in this run's \`agentrc-eval-results\` artifact: $RUN_URL"
          } > "$BODY_FILE"

          EXISTING_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)

          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING_ID" -X PATCH -f body=@"$BODY_FILE"
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$BODY_FILE"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          name: agentrc-eval-results
          path: .agentrc-eval-out/
          retention-days: 30
