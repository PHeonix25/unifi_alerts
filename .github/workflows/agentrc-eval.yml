name: Agentrc Eval Harness

# Manual-only. Runs scripts/run_agentrc_eval.py (phase 1 of the
# agentic-eval-harness plan, docs/research/agentic-eval-harness.md, #287)
# against agentrc.eval.json's planning cases and writes the raw plans and
# checklist verdicts as a build artifact. Advisory: never gates a PR, never
# runs on push, and costs a model API call per case.
#
# Needs an ANTHROPIC_API_KEY repo secret (the default --provider anthropic
# has no zero-secret option - GitHub Models, the original free default, was
# retired 2026-07-30; see docs/research/agentic-eval-harness.md and #319).
# Point --provider/--model/--base-url at another endpoint (with a matching
# secret as the token) to try a different model - phase 2
# (agentrc-eval-cross-model.yml) loops this over several models at once.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Only run this case id (e.g. case-1); leave blank for all cases"
        required: false
        default: ""
      model:
        description: "Model id"
        required: false
        default: "claude-haiku-4-5-20251001"

permissions:
  contents: read

jobs:
  run-eval:
    name: Run agentrc.eval.json against ${{ inputs.model }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3
        with:
          python-version: "3.14"

      - name: Run harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_agentrc_eval.py \
            --model "${{ inputs.model }}" \
            ${{ inputs.case != '' && format('--case {0}', inputs.case) || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agentrc-eval-results
          path: .agentrc-eval-out/
          retention-days: 30
