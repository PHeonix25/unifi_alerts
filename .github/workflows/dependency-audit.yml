name: Dependency audit

# Dependency-vulnerability scanning (pip-audit). Runs on every push and pull
# request to dev and main, and on a weekly schedule so newly disclosed
# vulnerabilities are caught even when the code has not changed.
#
# Static analysis (CodeQL SAST) is handled by GitHub's CodeQL default setup,
# configured in Settings > Code security and analysis, not by a workflow in
# this repository. An advanced workflow-based CodeQL config cannot coexist with
# default setup (GitHub rejects the SARIF upload), so SAST lives there and this
# workflow owns dependency auditing only.
#
# pip-audit is advisory only (continue-on-error on the audit step). Every
# finding sits in a dependency whose version Home Assistant constrains, not in
# code this repository controls, so a blocking scan would fail PRs for reasons
# no contributor can fix. As of 2026-09-18 the scan exits non-zero with ~22
# advisories across pillow (12.2.0, fixed 12.3.0), pyjwt (2.12.1, fixed
# 2.13.0), cryptography (48.0.1, fixed 49.0.0/50.0.0) and aiohttp (3.14.1,
# fixed 3.14.2). The first three are transitive through homeassistant; aiohttp
# is listed directly as >=3.9.0 but homeassistant constrains which version
# resolves.
#
# The Home Assistant pin moving forward does not by itself clear the findings:
# an earlier revision of this comment assumed it had, and was wrong. After a
# pytest-homeassistant-custom-component bump, read THIS JOB'S LOG rather than
# the check's tick (continue-on-error makes it green either way); if there are
# no findings, flip continue-on-error to false on the audit step below. See
# docs/DEVELOPING.md for the same note in prose, including the --ignore-vuln
# alternative if you want new disclosures to block while known ones do not.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Mondays 06:00 UTC, before the weekly Dependabot run (07:00 Brisbane).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency vulnerability scan (advisory, non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Advisory only: a freshly disclosed CVE must not block merges. The job
    # surfaces findings for the maintainer to triage and bump dependencies.
    # continue-on-error sits on the audit step itself (not the job) so the
    # step failure is swallowed and the check reports green; a job-level flag
    # only spares the overall run and still surfaces the job as failed.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"

      - name: Install dev dependencies and pip-audit
        run: |
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Run pip-audit (advisory)
        continue-on-error: true
        run: pip-audit
