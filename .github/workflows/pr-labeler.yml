name: PR Labeler

# Auto-applies a release-notes label to PRs based on their Conventional Commit
# title prefix, so `gh release create --generate-notes` groups them correctly.
# Manual labels always win: if any release-notes label is already set, this
# workflow does nothing.
#
# Mapping:
#   feat:     -> feat
#   fix:      -> fix
#   docs:     -> documentation
#   test(s):  -> tests
#   ci:       -> ci
#   security: -> security
# Other prefixes (chore, build, refactor, perf, style, etc.) intentionally fall
# through to "Other Changes" in the release notes.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply Conventional Commit label
    runs-on: ubuntu-latest
    steps:
      - name: Apply label from PR title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title_lower="$(echo "$PR_TITLE" | tr '[:upper:]' '[:lower:]')"

          case "$title_lower" in
            *:*) ;;
            *)
              echo "PR title has no Conventional Commit prefix; nothing to do."
              exit 0
              ;;
          esac

          prefix="${title_lower%%:*}"
          type="${prefix%%(*}"
          type="${type%!}"

          case "$type" in
            feat)       label="feat" ;;
            fix)        label="fix" ;;
            docs)       label="documentation" ;;
            test|tests) label="tests" ;;
            ci)         label="ci" ;;
            security)   label="security" ;;
            *)
              echo "Prefix '$type' has no auto-label mapping; leaving PR unlabelled."
              exit 0
              ;;
          esac

          existing="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' || echo "")"
          if echo "$existing" | grep -qE '^(feat|fix|enhancement|bug|documentation|tests|ci|security|github-actions|dependencies)$'; then
            echo "PR already has a release-notes label; leaving alone."
            exit 0
          fi

          echo "Applying label '$label' to PR #$PR_NUMBER"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$label"
